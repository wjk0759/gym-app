services:
  db:
    image: pgvector/pgvector:pg16
    container_name: fitai-db
    environment:
      POSTGRES_USER: fitai
      POSTGRES_PASSWORD: fitai
      POSTGRES_DB: fitai
    ports:
      - "5432:5432"
    volumes:
      - fitai-pg:/var/lib/postgresql/data
      - ../db/schema.sql:/docker-entrypoint-initdb.d/01-schema.sql:ro

  redis:
    image: redis:7-alpine
    container_name: fitai-redis
    ports:
      - "6379:6379"

volumes:
  fitai-pg:

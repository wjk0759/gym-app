services:
  db:
    image: mysql:8.4
    container_name: fitai-db
    environment:
      MYSQL_DATABASE: fitai
      MYSQL_USER: fitai
      MYSQL_PASSWORD: fitai
      MYSQL_ROOT_PASSWORD: change-me-root
      TZ: UTC
    command:
      - --character-set-server=utf8mb4
      - --collation-server=utf8mb4_0900_ai_ci
      - --default-time-zone=+00:00
    ports:
      - "3306:3306"
    volumes:
      - fitai-mysql:/var/lib/mysql
    healthcheck:
      test: ["CMD-SHELL", "mysqladmin ping -h127.0.0.1 -ufitai -pfitai --silent"]
      interval: 10s
      timeout: 5s
      retries: 12
      start_period: 30s

  redis:
    image: redis:7-alpine
    container_name: fitai-redis
    ports:
      - "6379:6379"

volumes:
  fitai-mysql:

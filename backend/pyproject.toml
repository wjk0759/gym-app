[tool.ruff]
target-version = "py312"
line-length = 120
extend-exclude = [".venv", "media", "smoke_media", ".pytest_cache"]

[tool.ruff.lint]
select = ["E4", "E7", "E9", "F", "I", "B", "SIM", "PERF", "RUF"]
ignore = [
    # FastAPI uses File(...) / Query(...) as parameter defaults by design.
    "B008",
    # Chinese copy intentionally uses full-width punctuation.
    "RUF001",
    "RUF002",
    "RUF003",
    # Some noqa comments document intentionally broad exception boundaries.
    "RUF100",
]

[tool.pytest.ini_options]
testpaths = ["tests"]

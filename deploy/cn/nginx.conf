server {
    listen 80;
    server_name __DOMAIN__;
    root /var/www/jiaolian;
    index index.html;
    charset utf-8;

    access_log /var/log/nginx/jiaolian-access.log;
    error_log /var/log/nginx/jiaolian-error.log;

    location / {
        try_files $uri $uri.html $uri/ =404;
    }

    location = /health {
        default_type text/plain;
        return 200 "ok\n";
    }

    location = /favicon.ico {
        access_log off;
        log_not_found off;
        return 204;
    }
}

included:
  - FitAI
  - FitAITests
  - FitAIUITests

excluded:
  - build

# Keep this initial CI gate focused on the two structural limits from the
# handoff. Add rules incrementally instead of freezing a large legacy baseline.
only_rules:
  - file_length
  - type_body_length

file_length:
  warning: 600
  error: 1000
  ignore_comment_only_lines: true

type_body_length:
  warning: 400
  error: 600

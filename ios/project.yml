name: FitAI
options:
  bundleIdPrefix: com.wjk
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: zh-Hans
  xcodeVersion: "16.0"
  createIntermediateGroups: true

settings:
  base:
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_STRICT_CONCURRENCY: minimal

targets:
  FitAI:
    type: application
    platform: iOS
    sources:
      - path: FitAI
        excludes:
          - "Resources/Info.plist"
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.wjk.fitai
        PRODUCT_NAME: FitAI
        INFOPLIST_FILE: FitAI/Resources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_ENTITLEMENTS: FitAI/Resources/FitAI.entitlements
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        SUPPORTS_MACCATALYST: NO
        ENABLE_PREVIEWS: YES
      configs:
        Debug:
          ENABLE_TESTABILITY: YES
    scheme:
      gatherCoverageData: false
      testTargets:
        - FitAITests

  FitAITests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: FitAITests
    dependencies:
      - target: FitAI
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.wjk.fitai.tests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/FitAI.app/FitAI"
        BUNDLE_LOADER: "$(TEST_HOST)"
        CODE_SIGN_STYLE: Automatic

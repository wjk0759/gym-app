name: FitAI
options:
  bundleIdPrefix: com.wjk
  deploymentTarget:
    iOS: "17.0"
  developmentLanguage: zh-Hans
  xcodeVersion: "16.0"
  createIntermediateGroups: true

settings:
  base:
    SDKROOT: iphoneos
    SWIFT_VERSION: "5.9"
    MARKETING_VERSION: "0.1.0"
    CURRENT_PROJECT_VERSION: "1"
    SWIFT_STRICT_CONCURRENCY: minimal
    DEVELOPMENT_TEAM: ZCHURNA4CM

targets:
  FitAIWorkoutCore:
    type: framework
    supportedDestinations: [iOS, watchOS]
    deploymentTarget:
      iOS: "17.0"
      watchOS: "10.0"
    sources:
      - path: FitAIWorkoutCore/Sources/FitAIWorkoutCore
    settings:
      base:
        DYLIB_INSTALL_NAME_BASE: "@rpath"
        GENERATE_INFOPLIST_FILE: YES
        PRODUCT_BUNDLE_IDENTIFIER: com.wjk.fitai.workoutcore
        PRODUCT_NAME: FitAIWorkoutCore
        SUPPORTED_PLATFORMS: "iphoneos iphonesimulator watchos watchsimulator"
        SKIP_INSTALL: YES
        SWIFT_VERSION: "5.9"
        IPHONEOS_DEPLOYMENT_TARGET: "17.0"
        WATCHOS_DEPLOYMENT_TARGET: "10.0"

  FitAI:
    type: application
    platform: iOS
    sources:
      - path: FitAI
        excludes:
          - "Resources/Info.plist"
    dependencies:
      - target: FitAIWorkoutCore
      - target: FitAIWatch
        embed: true
    settings:
      base:
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks"
        PRODUCT_BUNDLE_IDENTIFIER: com.wjk.fitai
        PRODUCT_NAME: FitAI
        SUPPORTED_PLATFORMS: "iphoneos iphonesimulator"
        INFOPLIST_FILE: FitAI/Resources/Info.plist
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        CODE_SIGN_ENTITLEMENTS: FitAI/Resources/FitAI.entitlements
        TARGETED_DEVICE_FAMILY: "1"
        CODE_SIGN_STYLE: Automatic
        SUPPORTS_MACCATALYST: NO
        ENABLE_PREVIEWS: YES
        # 上 TestFlight 前必须替换为生产 HTTPS 域名；默认用保留域名避免误连 localhost。
        FITAI_API_BASE_URL: "https://hk-api.jiaolianfit.cn/api/v1"
      configs:
        Debug:
          ENABLE_TESTABILITY: YES
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
          FITAI_API_BASE_URL: "http://127.0.0.1:8000/api/v1"
          # 免费个人团队不支持 Sign in with Apple；Debug 用独立 App ID 和
          # 无 applesignin 的 entitlements，Release 仍使用正式配置。
          PRODUCT_BUNDLE_IDENTIFIER: com.wjk.fitai.dev
          CODE_SIGN_ENTITLEMENTS: FitAI/Resources/FitAI-Debug.entitlements
    scheme:
      gatherCoverageData: false
      testTargets:
        - FitAITests
        - FitAIUITests

  FitAIWatch:
    type: application
    platform: watchOS
    deploymentTarget: "10.0"
    sources:
      - path: FitAIWatch
        excludes:
          - "Info.plist"
          - "FitAIWatch.entitlements"
    dependencies:
      - target: FitAIWorkoutCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.wjk.fitai.watchkitapp
        PRODUCT_NAME: FitAIWatch
        SDKROOT: watchos
        SUPPORTED_PLATFORMS: "watchos watchsimulator"
        INFOPLIST_FILE: FitAIWatch/Info.plist
        LD_RUNPATH_SEARCH_PATHS: "$(inherited) @executable_path/Frameworks"
        CODE_SIGN_ENTITLEMENTS: FitAIWatch/FitAIWatch.entitlements
        TARGETED_DEVICE_FAMILY: "4"
        CODE_SIGN_STYLE: Automatic
        GENERATE_INFOPLIST_FILE: NO
        SKIP_INSTALL: YES
        ASSETCATALOG_COMPILER_GLOBAL_ACCENT_COLOR_NAME: AccentColor
        ASSETCATALOG_COMPILER_APPICON_NAME: AppIcon
        FITAI_COMPANION_BUNDLE_ID: com.wjk.fitai
      configs:
        Debug:
          PRODUCT_BUNDLE_IDENTIFIER: com.wjk.fitai.dev.watchkitapp
          FITAI_COMPANION_BUNDLE_ID: com.wjk.fitai.dev
          SWIFT_ACTIVE_COMPILATION_CONDITIONS: DEBUG
        Release:
          PRODUCT_BUNDLE_IDENTIFIER: com.wjk.fitai.watchkitapp
          FITAI_COMPANION_BUNDLE_ID: com.wjk.fitai

  FitAITests:
    type: bundle.unit-test
    platform: iOS
    sources:
      - path: FitAITests
    dependencies:
      - target: FitAI
      - target: FitAIWorkoutCore
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.wjk.fitai.tests
        PRODUCT_NAME: FitAITests
        GENERATE_INFOPLIST_FILE: YES
        TEST_HOST: "$(BUILT_PRODUCTS_DIR)/FitAI.app/FitAI"
        BUNDLE_LOADER: "$(TEST_HOST)"
        CODE_SIGN_STYLE: Automatic

  FitAIUITests:
    type: bundle.ui-testing
    platform: iOS
    sources:
      - path: FitAIUITests
    dependencies:
      - target: FitAI
    settings:
      base:
        PRODUCT_BUNDLE_IDENTIFIER: com.wjk.fitai.uitests
        PRODUCT_NAME: FitAIUITests
        GENERATE_INFOPLIST_FILE: YES
        TEST_TARGET_NAME: FitAI
        CODE_SIGN_STYLE: Automatic

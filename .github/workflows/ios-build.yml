name: iOS Build

on:
  workflow_dispatch:
  push:
    paths:
      - "ios/**"
      - "data/vital/**"
      - "scripts/vital/**"
      - ".github/workflows/ios-build.yml"
  pull_request:
    paths:
      - "ios/**"
      - "data/vital/**"
      - "scripts/vital/**"
      - ".github/workflows/ios-build.yml"

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Validate catalog data
        run: python3 scripts/vital/validate_catalog.py

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate

      - name: Install SwiftLint
        run: brew install swiftlint

      - name: Lint structure limits
        working-directory: ios
        run: swiftlint lint --config .swiftlint.yml

      - name: Test shared workout core
        working-directory: ios
        run: swift test --package-path FitAIWorkoutCore

      - name: Build for simulator
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild \
            -project FitAI.xcodeproj \
            -scheme FitAI \
            -sdk iphonesimulator \
            -destination "generic/platform=iOS Simulator" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build 2>&1 | tee build.log

      - name: Annotate build errors
        if: failure()
        run: |
          if [ -f ios/build.log ]; then
            grep -E "error: " ios/build.log | head -30 | while IFS= read -r line; do
              echo "::error::$line"
            done
          fi

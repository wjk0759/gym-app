name: iOS Build

on:
  workflow_dispatch:
  push:
    paths:
      - "ios/**"
      - ".github/workflows/ios-build.yml"
  pull_request:
    paths:
      - "ios/**"
      - ".github/workflows/ios-build.yml"

concurrency:
  group: ios-build-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    # macos-15 is arm64 and has been capacity-constrained for hosted runners.
    # The simulator-only build does not need arm64, so use the Intel image
    # temporarily to avoid the long/missing arm64 queue.
    # Revert to macos-15 once arm64 hosted capacity is healthy again.
    runs-on: macos-15-intel
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate

      - name: Build for simulator
        working-directory: ios
        run: |
          set -o pipefail
          xcodebuild \
            -project FitAI.xcodeproj \
            -scheme FitAI \
            -sdk iphonesimulator \
            -destination "generic/platform=iOS Simulator" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build 2>&1 | tee build.log

      - name: Annotate build errors
        if: failure()
        run: |
          if [ -f ios/build.log ]; then
            grep -E "error: " ios/build.log | head -30 | while IFS= read -r line; do
              echo "::error::$line"
            done
          fi

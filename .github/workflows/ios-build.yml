name: iOS Build

on:
  workflow_dispatch:
  push:
    paths:
      - "ios/**"
      - ".github/workflows/ios-build.yml"
  pull_request:
    paths:
      - "ios/**"
      - ".github/workflows/ios-build.yml"

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-15
    timeout-minutes: 30

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install XcodeGen
        run: brew install xcodegen

      - name: Generate Xcode project
        working-directory: ios
        run: xcodegen generate

      - name: Build for simulator
        working-directory: ios
        run: |
          xcodebuild \
            -project FitAI.xcodeproj \
            -scheme FitAI \
            -sdk iphonesimulator \
            -destination "generic/platform=iOS Simulator" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO \
            build

      - name: Run unit tests
        working-directory: ios
        run: |
          set -o pipefail
          DEVICE_ID=$(xcrun simctl list devices available -j | python3 -c 'import json,sys; data=json.load(sys.stdin)["devices"]; print(next(d["udid"] for runtime, devices in data.items() if "iOS" in runtime for d in devices if d.get("isAvailable")))')
          echo "Using simulator: $DEVICE_ID"
          xcodebuild test \
            -project FitAI.xcodeproj \
            -scheme FitAI \
            -destination "id=$DEVICE_ID" \
            CODE_SIGNING_ALLOWED=NO \
            CODE_SIGNING_REQUIRED=NO 2>&1 | tee test.log

      - name: Publish test log on failure
        if: failure()
        run: |
          if [ -f ios/test.log ]; then
            tail -n 500 ios/test.log > ios/test-failure.log
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add ios/test-failure.log
            git diff --cached --quiet || git commit -m "ci: capture iOS test failure [skip ci]"
            git push origin HEAD:main
          fi
